- title: 云记：AI 驱动的智能语音转写与会议纪要中台
  subtitle: 2024.09 - 2026.04 · 星乾科技实习研发
  description: 集高精度流式语音识别、会议长音频智能提炼总结、思维导图自动生成于一体的智能语音协同微服务平台。
  highlights:
    - 整合讯飞语音与阿里通义千问双轨 ASR 引擎，构建实时 PCM 音频流式分块转写与服务端低延迟长连接管道。
    - 基于 LLM 提示词工程深度研发智能会议纪要模块，自动提取行动待办项（Action Items）并结构化生成交互式思维导图。
    - 服务端基于国产达梦数据库（DM8）与 Spring Boot 微服务架构设计，构建严格的增量迁移规范与敏感数据加密脱敏管道。
    - 前端配合 Vue3 响应式设计、手写涂鸦板与波形可视化（SiriWave），打造全端一致的流畅录音与文档交互体验。
