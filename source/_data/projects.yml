- title: MuseLib：企业级 Agentic RAG 智能知识库检索系统
  subtitle: 2024.03 - 2024.08 · 核心架构与后端研发
  description: 面向复杂图书与专业知识库场景的下一代智能问答检索系统，基于大语言模型与 Agent 编排构建。
  highlights:
    - 针对大模型单点 API 故障与幻觉问题，设计模型高可用容灾与重试降级策略，保障问答链路 99.9% 稳定可用。
    - 引入问题重写（Query Rewriting）、多路召回（向量相似度 + BM25 关键词）与重排序（Rerank）机制，将检索 Top-3 召回准确率提升至 92% 以上。
    - 自主设计全链路可观测性 Trace 切面（@RagTraceRoot / @RagTraceNode），打通黑盒思考耗时诊断，实现毫秒级瓶颈定位。
    - 结合动态意图识别（Intent Recognition）与对话记忆压缩，大幅降低无效 Token 消耗并显著提升多轮交互体验。
  link: /2025/02/27/aliyun-bailian-knowledge-base/
