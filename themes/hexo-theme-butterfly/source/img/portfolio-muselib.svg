<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="500" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
  </g>

  <!-- Central Hub: Agent Brain -->
  <g transform="translate(300, 240)" filter="url(#shadow)">
    <!-- Outer Rings -->
    <circle r="90" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
    <circle r="125" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    
    <!-- Central Hexagon Base -->
    <circle r="60" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3"/>
    
    <!-- Brain / AI Icon Symbol -->
    <path d="M-22 -10 C-22 -26 22 -26 22 -10 C28 -10 32 0 28 12 C24 24 10 26 0 26 C-10 26 -24 24 -28 12 C-32 0 -28 -10 -22 -10 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-10" cy="-2" r="3.5" fill="#38bdf8"/>
    <circle cx="10" cy="-2" r="3.5" fill="#38bdf8"/>
    <path d="M-10 12 Q0 18 10 12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Satellite Nodes & Connection Lines -->
  <!-- Node 1: Vector DB (Top Left) -->
  <line x1="160" y1="120" x2="250" y2="195" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <g transform="translate(140, 110)">
    <rect x="-45" y="-22" width="90" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Vector DB</text>
  </g>

  <!-- Node 2: Intent Rewriter (Top Right) -->
  <line x1="440" y1="120" x2="350" y2="195" stroke="#a855f7" stroke-width="2" opacity="0.7"/>
  <g transform="translate(460, 110)">
    <rect x="-55" y="-22" width="110" height="44" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="5" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Agentic RAG</text>
  </g>

  <!-- Node 3: Multi-Route Rerank (Bottom Left) -->
  <line x1="170" y1="360" x2="250" y2="285" stroke="#6366f1" stroke-width="2" opacity="0.7"/>
  <g transform="translate(150, 370)">
    <rect x="-48" y="-22" width="96" height="44" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="5" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Rerank 92%</text>
  </g>

  <!-- Node 4: Trace Observability (Bottom Right) -->
  <line x1="430" y1="360" x2="350" y2="285" stroke="#0284c7" stroke-width="2" opacity="0.7"/>
  <g transform="translate(450, 370)">
    <rect x="-50" y="-22" width="100" height="44" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="5" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Trace AOP</text>
  </g>

  <!-- Header Badge -->
  <g transform="translate(300, 48)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="5" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">MUSELIB CORE</text>
  </g>
</svg>
